# aftercast global configuration
# Location: $AFTERCAST_HOME/aftercast.toml   (e.g. P:\Streams\aftercast.toml)
# Secrets: use "keyring:<name>" or "env:<NAME>" instead of plain values.

[channel]
series = "Insomnia Driven Development"
short = "IDD"
episode_prefix = "ep"          # session folder: 2026-11-19_ep042
episode_pad = 3
# Title handling: "keep" = never touch the YouTube title;
# "format" = set title from title_format at session start (costs one videos.update).
title_mode = "keep"
title_format = "{{ channel.short }} #{{ stream.episode_padded }} · {{ quest.title | default('Live coding') }}"

[paths]
sessions = "sessions"          # relative to home
templates = "templates"
editor = "code"                # used by :open readme  (e.g. "nvim", "code")
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
yt_dlp = "yt-dlp"
python = "python"              # default: the venv from `aftercast setup` if installed
whisper_cli = "whisper-cli"    # for the whisper.cpp backend
tesseract = "tesseract"        # default: the copy from `aftercast setup` if installed

[youtube]
client_secret_file = "state/client_secret.json"   # OAuth desktop client from Google Cloud
token_profile = "main"                           # keyring entry aftercast/youtube/main
# Description push policy. Pushing costs quota (videos.update).
push_on_start = true
push_on_end = true
live_autosync = false           # true = push automatically after README saves (debounced)
autosync_debounce_s = 5
autosync_min_interval_s = 90
daily_quota_reserve = 1500      # never spend below this many remaining units
# YouTube ends the chat stream about every 10 s and each reopen costs 5 units. While chat is
# quiet, aftercast waits 10, 20, then up to this many seconds before reopening (immediately
# while chat is busy or a :latency measurement runs).
chat_idle_max_s = 30
# bot_profile = "bot"           # optional separate bot account (must be a moderator of the channel)

[obs]
url = "ws://127.0.0.1:4455"
password = "keyring:obs"
require_recording = true        # pre-flight warns loudly if OBS is not recording

[obs.scenes]
main = "Code"
brb = "BRB"
privacy = "Privacy"
starting = "Starting Soon"
ending = "Ending"

[stream]
default_latency_s = 5.0         # used until measured (:latency)
first_chapter_title = "Start"
chapter_on_quest_change = true
chapter_on_brb = false          # add "Break" chapters
chapter_on_question = false     # add "Q: ..." chapter when a question is shown
chapter_on_latency = true       # :latency adds a "Latency check" chapter, then returns to the previous one

[readme]
seed_template = "session-readme.md"   # copied into each new session as README.md
max_chars = 5000
expose_env = ["DISCORD_INVITE"]       # only these env vars are available as {{ env.X }}
link_style = "text_colon_url"         # [text](url) → "text: url"

[vars]
github = "https://github.com/your-handle"
discord = "https://discord.gg/xxxx"
twitter = "https://x.com/your-handle"
roadmaps = "https://github.com/your-handle/roadmaps"
tagline = "I will sleep when it compiles..."

[vars.support]
upi = "you@upi"
kofi = "https://ko-fi.com/you"

[bot]
enabled = true
prefix = "!"
global_cooldown_s = 3
user_cooldown_s = 20
default_reply = "overlay"       # overlay | chat | both
max_chat_replies_per_hour = 30  # hard cap to protect quota
# Your other channels (ids start with UC; see author_channel_id in a session's chat.jsonl)
# that may use owner commands such as !lat and !title. They watch the stream with its delay,
# so their !chapter and !mark are latency-corrected like a mod's.
owner_accounts = []

[bot.commands]
# Custom static commands: name = { text = "...", reply = "chat|overlay|both" }. Templates allowed.
links   = { text = "GitHub {{ vars.github }} · Discord {{ vars.discord }}", reply = "chat" }
discord = { text = "{{ vars.discord }}", reply = "chat" }
support = { text = "Support the stream: {{ vars.support.kofi }} · UPI {{ vars.support.upi }}", reply = "chat" }

[bot.moderation]
delete_links_from_non_mods = false
banned_words = []

[overlay]
port = 7878
font_mono = "JetBrains Mono"
font_sans = "Inter"
bg = "#303030"
accent = "#FF5555"
fg = "#FFFFFF"
muted = "#9A9A9A"

[capture]
keys = true
# Typed letters and shortcuts are recorded (and shown on the keys overlay) in every app, except:
# privacy mode, apps in keys_deny_apps, windows whose title matches keys_deny_title_patterns,
# and a focused password box. App names are process names, case-insensitive.
# Trusted apps skip the password-box check (asking Electron apps like VS Code turns on their
# screen reader mode). A password typed at a terminal prompt is not detected: press privacy first.
keys_trusted_apps = [
  "Code.exe", "Code - Insiders.exe", "Cursor.exe", "Zed.exe", "WindowsTerminal.exe",
  "wezterm-gui.exe", "alacritty.exe", "nvim.exe", "nvim-qt.exe", "neovide.exe",
  "pwsh.exe", "powershell.exe", "conhost.exe",
]
keys_deny_apps = [
  "Bitwarden.exe", "1Password.exe", "KeePass.exe", "KeePassXC.exe", "Dashlane.exe", "NordPass.exe",
  "Enpass.exe", "Proton Pass.exe", "CredentialUIBroker.exe", "consent.exe", "LogonUI.exe", "LockApp.exe",
]
keys_deny_title_patterns = [
  "(?i)passw", "(?i)passcode", "(?i)bitwarden", "(?i)1password", "(?i)keepass", "(?i)\\.env",
  "(?i)secret", "(?i)credential", "(?i)log ?in", "(?i)sign ?in", "(?i)sign ?up",
  "(?i)two-factor|2fa|verification code|one-time code", "(?i)incognito|inprivate|private browsing",
]
shell = true
shell_spool = "state/shell-spool.jsonl"
secret_patterns = [
  "sk-[A-Za-z0-9_-]{20,}", "ghp_[A-Za-z0-9]{30,}", "github_pat_[A-Za-z0-9_]{30,}",
  "AKIA[0-9A-Z]{16}", "AIza[0-9A-Za-z_-]{35}", "xox[baprs]-[A-Za-z0-9-]{10,}",
  "-----BEGIN [A-Z ]*PRIVATE KEY-----"
]
# Folders searched (git_max_depth levels deep) after the stream for commits made during it,
# e.g. ["D:/code"].
git_roots = []
git_max_depth = 3

[hotkeys]
mark = "Ctrl+Alt+M"
checkpoint = "Ctrl+Alt+C"
privacy = "Ctrl+Alt+P"
brb = "Ctrl+Alt+B"

[post]
auto_after_finalize = false
use_vod = false                 # also download the YouTube VOD (for calibration / fallback)
transcriber = "faster-whisper"  # faster-whisper | whisperx | whisper-cpp
whisper_model = "large-v3"      # RTX 4060 8GB: large-v3 float16 fits; use int8_float16 if VRAM is tight
whisper_compute_type = "float16"
language = "auto"               # "en", "hi", or "auto" (Hinglish: test both)
frame_interval_s = 30
scene_threshold = 0.30
phash_max_distance = 6          # frames within this hamming distance of the previous kept frame are dropped
frame_width = 1280
silence_db = -35
silence_min_s = 4.0
focus_min_keys_per_10s = 3      # silent but typing ≥ this → "focus", not "dead"
ocr = false

[render]
encoder = "h264_nvenc"          # h264_nvenc | libx264
cq = 21
pad_start_ms = 250
pad_end_ms = 400
short_max_s = 60
keys_overlay = "alpha"          # burn | alpha | none
captions = "srt"                # burn | srt | none

[external]
# Optional: a future quest app writes the current quest here; aftercast watches it.
current_quest_file = ""         # e.g. "P:/quests/current.json"
