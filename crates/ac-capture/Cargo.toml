[package]
name = "ac-capture"
description = "Input hook, global hotkeys, foreground app detection and shell spool tail."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ac-core.workspace = true
global-hotkey = "0.10"
rdev = "0.5"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Accessibility"] }

[dev-dependencies]
tempfile.workspace = true
