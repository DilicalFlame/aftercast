[package]
name = "aftercast"
description = "TUI companion for live coding streams on YouTube."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ac-bot.workspace = true
ac-capture.workspace = true
ac-obs.workspace = true
ac-post.workspace = true
ac-server.workspace = true
ac-template.workspace = true
ac-tui.workspace = true
ac-youtube.workspace = true
clap.workspace = true
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-std", "io-util"] }
ulid.workspace = true
httpdate.workspace = true
keyring.workspace = true
tracing.workspace = true
ac-core.workspace = true

[dev-dependencies]
chrono.workspace = true
futures-util = { version = "0.3", default-features = false }
jsonschema.workspace = true
tempfile.workspace = true
tokio-tungstenite = "0.29"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }
