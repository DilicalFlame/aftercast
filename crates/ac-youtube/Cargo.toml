[package]
name = "ac-youtube"
description = "YouTube OAuth, REST client, quota accounting and live chat stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ac-core.workspace = true
base64 = "0.23"
chrono-tz = { version = "0.10", default-features = false }
getrandom = "0.4"
http = "1"
keyring.workspace = true
open = "5"
prost = "0.14"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "sync", "time"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = "0.14"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
