# Captions, a first party overlay as a plugin (id "captions": it is the overlay of that name).
[overlay]
id = "captions"
name = "Captions"
version = "1.0.0"
api = 1
entry = "index.html"
description = "Live captions from the microphone."
author = "aftercast"
license = "MIT"

[frame]
x = 260
y = 740
width = 1400
height = 200
align = "left"

[capabilities]
reads = ["captions"]
audio = false
network = []

[[skin]]
id = "nvim"
name = "Neovim"

[[skin]]
id = "clean"
name = "Clean"

[[skin]]
id = "broadcast"
name = "Broadcast"

[[skin]]
id = "glass"
name = "Glass"

[[skin]]
id = "minimal"
name = "Minimal"

[[scenario]]
name = "Sample"
[scenario.state.captions]
action = "show"
[scenario.state.captions.data]
text = "so this is where the parser gets interesting"
final = false
