# Keys, a first party overlay as a plugin (id "keys": it is the overlay of that name).
[overlay]
id = "keys"
name = "Keys"
version = "1.0.0"
api = 1
entry = "index.html"
description = "The keys you type, as bubbles."
author = "aftercast"
license = "MIT"

[frame]
x = 1400
y = 120
width = 480
height = 520
align = "center"

[capabilities]
reads = ["keys"]
audio = false
network = []

[[skin]]
id = "nvim"
name = "Neovim"

[[skin]]
id = "clean"
name = "Clean"

[[skin]]
id = "broadcast"
name = "Broadcast"

[[skin]]
id = "glass"
name = "Glass"

[[skin]]
id = "minimal"
name = "Minimal"

[[scenario]]
name = "Sample"
[scenario.state.keys]
action = "hide"
