# Latency, a first party overlay as a plugin (id "latency": it is the overlay of that name).
[overlay]
id = "latency"
name = "Latency"
version = "1.0.0"
api = 1
entry = "index.html"
description = "The stream latency measurement."
author = "aftercast"
license = "MIT"

[frame]
x = 460
y = 390
width = 1000
height = 300
align = "center"

[capabilities]
reads = ["latency"]
audio = false
network = []

[[skin]]
id = "nvim"
name = "Neovim"

[[skin]]
id = "clean"
name = "Clean"

[[skin]]
id = "broadcast"
name = "Broadcast"

[[skin]]
id = "glass"
name = "Glass"

[[skin]]
id = "minimal"
name = "Minimal"

[[scenario]]
name = "Sample"
[scenario.state.latency]
action = "show"
[scenario.state.latency.data]
start_ms = "$now"
