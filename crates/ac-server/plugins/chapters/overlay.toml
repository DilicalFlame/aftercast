# Chapter, a first party overlay as a plugin (id "chapters": it is the overlay of that name).
[overlay]
id = "chapters"
name = "Chapter"
version = "1.0.0"
api = 1
entry = "index.html"
description = "The current chapter title."
author = "aftercast"
license = "MIT"

[frame]
x = 40
y = 960
width = 900
height = 80
align = "left"

[capabilities]
reads = ["chapters"]
audio = false
network = []

[[skin]]
id = "nvim"
name = "Neovim"

[[skin]]
id = "clean"
name = "Clean"

[[skin]]
id = "broadcast"
name = "Broadcast"

[[skin]]
id = "glass"
name = "Glass"

[[skin]]
id = "minimal"
name = "Minimal"

[[scenario]]
name = "Sample"
[scenario.state.chapters]
action = "show"
[scenario.state.chapters.data]
title = "Tokenizer edge cases"
