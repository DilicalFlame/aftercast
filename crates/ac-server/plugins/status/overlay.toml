# Status bar, a first party overlay as a plugin (id "status": it is the overlay of that name).
[overlay]
id = "status"
name = "Status bar"
version = "1.0.0"
api = 1
entry = "index.html"
description = "A thin bar that shows the overlays docked into it."
author = "aftercast"
license = "MIT"

[frame]
x = 0
y = 1044
width = 1920
height = 36
align = "left"

[capabilities]
reads = ["now", "brb", "latency", "chapters", "toast", "status"]
audio = false
network = []

[[skin]]
id = "nvim"
name = "Neovim"

[[skin]]
id = "clean"
name = "Clean"

[[skin]]
id = "broadcast"
name = "Broadcast"

[[skin]]
id = "glass"
name = "Glass"

[[skin]]
id = "minimal"
name = "Minimal"

[[scenario]]
name = "Sample"
[scenario.state.now]
action = "show"
[scenario.state.now.data]
quest = "Writing a parser in Rust"
live_since_ms = "$now-3723000"
[scenario.state.latency]
action = "show"
[scenario.state.latency.data]
start_ms = "$now"
[scenario.state.chapters]
action = "show"
[scenario.state.chapters.data]
title = "Tokenizer edge cases"
[scenario.state.toast]
action = "show"
[scenario.state.toast.data]
text = "Thanks for the Super Chat, viewer42!"
