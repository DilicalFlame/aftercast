[package]
name = "ac-server"
description = "Overlay and local API server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ac-core.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
getrandom = "0.4"
lofty = "0.25"
qrcode = { version = "0.15", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync", "macros", "rt", "time"] }
toml.workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.29"
