name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste tokens, `client_secret.json`, `api-token`, or captured key and shell files (`keys.jsonl.zst`, `shell.jsonl`). Blur anything private in screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it also happens in `aftercast rehearse`, say so.
      placeholder: |
        1. aftercast rehearse
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`aftercast doctor` output"
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aftercast version
      description: "`aftercast --version`, or the commit you built"
    validations:
      required: true
  - type: input
    id: obs
    attributes:
      label: OBS version and Windows version
      placeholder: OBS 31.0, Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `<home>\logs` or `derived/logs/<stage>.log`.
      render: text
