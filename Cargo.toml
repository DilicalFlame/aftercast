[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ac-bot = { path = "crates/ac-bot" }
ac-capture = { path = "crates/ac-capture" }
ac-core = { path = "crates/ac-core" }
ac-library = { path = "crates/ac-library" }
ac-mcp = { path = "crates/ac-mcp" }
ac-obs = { path = "crates/ac-obs" }
ac-post = { path = "crates/ac-post" }
ac-render = { path = "crates/ac-render" }
ac-server = { path = "crates/ac-server" }
ac-template = { path = "crates/ac-template" }
ac-tui = { path = "crates/ac-tui" }
ac-youtube = { path = "crates/ac-youtube" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
httpdate = "1"
jsonschema = { version = "0.61", default-features = false }
keyring = "3.6"
regex = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = "1.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
ulid = "3"
